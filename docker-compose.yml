# Local development database only. The port is bound to 127.0.0.1, so it is
# not reachable from other machines. Host port 5433 avoids clashing with a
# PostgreSQL installed directly on the machine (which uses 5432). Production uses its own managed database
# and its own credentials.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jqe
      POSTGRES_PASSWORD: jqe_local_dev
      POSTGRES_DB: jqe_dashboard
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jqe -d jqe_dashboard"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
